version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '3000:3000'
    environment:
      DATABASE_URL: 'postgresql://postgres:password@db:5432/100xprep'
      REDIS_HOST: 'redis://redis:6379'
      NEXTAUTH_URL: 'http://localhost:3000'
      NEXTAUTH_SECRET: '100xprep_@!_secret'
    depends_on:
      - db
      - redis

  db:
    image: postgres:13
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: 100xprep
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:6
    restart: always
    ports:
      - '6379:6379'

volumes:
  postgres_data: